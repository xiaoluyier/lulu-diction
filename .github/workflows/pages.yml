name: Publish Lumei studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/*.test.mjs
      - uses: actions/cache@v4
        with:
          path: .cache/*.zip
          key: vosk-fr-it-official-0.22
      - run: python -m pip install requests
      - run: python tools/models.py
      - run: npm ci --ignore-scripts --no-audit
      - uses: actions/cache@v4
        with:
          path: site/voices/*.onnx
          key: piper-siwis-paola-medium-v1
      - run: python tools/natural_voices.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: publish
        uses: actions/deploy-pages@v4

